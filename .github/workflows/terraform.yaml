# Plan on pull requests, apply on merge to main
# Ne tourne que sur les stacks modifiées (voir le job "changes")
name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false # never kill a running apply

jobs:
  # Détecte quelles stacks (dossiers aws/<projet>) ont changé
  changes:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique, pour pouvoir faire le git diff

      - id: detect
        env:
          # Commit de référence : la branche cible pour une PR, le commit d'avant pour un push
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Toutes les stacks = dossiers dans aws/, sauf les modules
          ALL=$(find aws -mindepth 1 -maxdepth 1 -type d ! -name aws.modules | sort)

          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # Pas de commit de référence (cas rare) : on prend tout par sécurité
            STACKS="$ALL"
          else
            CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            echo "Fichiers modifiés :"; echo "$CHANGED"

            if echo "$CHANGED" | grep -q '^\.github/workflows/terraform\.yaml$'; then
              # La pipeline elle-même a changé : on teste tout
              STACKS="$ALL"
            else
              # Modules modifiés (ex : s3-bucket)
              MODULES=$(echo "$CHANGED" | sed -n 's#^aws/aws\.modules/\([^/]*\)/.*#\1#p' | sort -u)
              STACKS=$(for s in $ALL; do
                # La stack a un fichier modifié
                if echo "$CHANGED" | grep -q "^$s/"; then echo "$s"; continue; fi
                # Ou elle appelle un module modifié
                for m in $MODULES; do
                  if grep -rqs "aws.modules/$m\"" "$s"; then echo "$s"; break; fi
                done
              done)
            fi
          fi

          # Format JSON attendu par la matrix, ex : ["aws/pgkube-guard"]
          JSON=$(printf '%s\n' $STACKS | jq -R . | jq -sc 'map(select(length > 0))')
          echo "Stacks à traiter : $JSON"
          echo "stacks=$JSON" >> "$GITHUB_OUTPUT"

  terraform:
    name: ${{ matrix.stack }}
    needs: changes
    if: needs.changes.outputs.stacks != '[]' # aucune stack modifiée : on ne lance rien
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Une stack à la fois, dans l'ordre alphabétique : aws/account (ressources partagées)
      # est appliquée avant les projets qui en dépendent
      max-parallel: 1
      matrix:
        # Un job par stack modifiée
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Init
        run: terraform init -input=false

      # Checks only on pull requests, already done before the merge
      - name: Format
        if: github.event_name == 'pull_request'
        run: terraform fmt -check -recursive

      - name: Validate
        if: github.event_name == 'pull_request'
        run: terraform validate

      - name: Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -lock-timeout=5m

      # Deploy on merge to main
      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve -lock-timeout=5m
